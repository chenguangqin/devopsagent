[project]
name = "devopsagent"
version = "0.1.0"
description = "A minimal Bedrock-powered agent loop for Harbor benchmarks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.41.5,<2",
    "harbor==0.24.0",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.15,<0.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devopsagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

