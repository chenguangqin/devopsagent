[project]
name = "devopsagent"
version = "0.2.0"
description = "Three CLI DevOps agents evaluated through a decoupled Harbor adapter."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.41.5,<2",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
langchain = [
    "langchain>=1.0,<2",
    "langchain-aws>=1.0,<2",
]
strands = [
    "strands-agents>=1.0,<2",
]
harbor = [
    "harbor==0.24.0",
]

[project.scripts]
devopsagent = "devopsagent.cli:main"
devopsagent-native = "devopsagent.cli:main_native"
devopsagent-langchain = "devopsagent.cli:main_langchain"
devopsagent-strands = "devopsagent.cli:main_strands"
devopsagent-eval = "evaluation.run_matrix:main"
agent-engineering-eval = "evaluation.agent_engineering:main"
command-agent-eval = "evaluation.command_framework.cli:main"
security-agent-datasets = "evaluation.security_catalog:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.15,<0.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devopsagent", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

